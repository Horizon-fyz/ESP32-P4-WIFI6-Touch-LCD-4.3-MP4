dependencies:
  idf: ">=5.5"

  lvgl/lvgl:
    version: "9.5.0"
    public: true

  waveshare/esp32_p4_wifi6_touch_lcd_4_3:
    version: "==1.0.1"

  # Wi-Fi 6 由板载 ESP32-C6 协处理器提供（SDIO），esp_wifi_remote 把标准
  # esp_wifi API 转发到 esp_hosted 从机。版本需要与 IDF 5.5 匹配。
  espressif/esp_hosted:
    version: "==1.4.7"
  espressif/esp_wifi_remote:
    version: "==0.14.5"

  # 图片解码：JPEG（P4 硬件解码）/ PNG / QOI，注册成 LVGL 图像解码器
  espressif/esp_lv_decoder:
    version: "0.5.0"

  # 音频播放：MP3（libhelix）+ WAV，回调写入 ES8311
  chmorgan/esp-audio-player:
    version: "1.1.0"

  # 视频里的 AAC/MP3 音轨解码（与官方 10_mp4_player 一致，<2.6 兼容 Rev1.3）
  espressif/esp_audio_codec:
    version: ">=2.3.0,<2.6.0"
